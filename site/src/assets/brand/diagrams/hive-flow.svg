<text x="32" y="216" class="sm b f-ink">Keeper</text>
<text x="32" y="234" class="sm f-muted">The human.</text><text x="32" y="251" class="sm f-muted">Answers cards</text><text x="32" y="268" class="sm f-muted">and approves</text><text x="32" y="285" class="sm f-muted">protected paths.</text>
<text x="156" y="216" class="sm b f-ink">queen</text>
<text x="156" y="234" class="sm f-muted">The one session</text><text x="156" y="251" class="sm f-muted">the Keeper talks</text><text x="156" y="268" class="sm f-muted">to. Never writes</text><text x="156" y="285" class="sm f-muted">code.</text>
<text x="276" y="216" class="sm b f-ink">scout</text>
<text x="276" y="234" class="sm f-muted">Plans. Turns a</text><text x="276" y="251" class="sm f-muted">goal into task</text><text x="276" y="268" class="sm f-muted">briefs.</text>
<text x="392" y="216" class="sm b f-ink">brief</text>
<text x="392" y="234" class="sm f-muted">Written before work starts: the</text><text x="392" y="251" class="sm f-muted">lease, the gate, the risk tier.</text>
<text x="592" y="216" class="sm b f-ink">builder</text>
<text x="592" y="234" class="sm f-muted">Writes the code,</text><text x="592" y="251" class="sm f-muted">inside the lease</text><text x="592" y="268" class="sm f-muted">only.</text>
<text x="720" y="216" class="sm b f-ink">reviewers</text>
<text x="720" y="234" class="sm f-muted">Two reviewers on</text><text x="720" y="251" class="sm f-muted">different models. Both</text><text x="720" y="268" class="sm f-muted">must pass. They never</text><text x="720" y="285" class="sm f-muted">fix.</text>
<text x="884" y="216" class="sm b f-ink">Waggle Gate</text>
<text x="884" y="234" class="sm f-muted">Checks every</text><text x="884" y="251" class="sm f-muted">commit</text><text x="884" y="268" class="sm f-muted">against the</text><text x="884" y="285" class="sm f-muted">lease.</text>
<text x="983" y="216" class="sm b f-ink">merge</text>
<text x="983" y="234" class="sm f-muted">Recorded in</text><text x="983" y="251" class="sm f-muted">DECISIONS.md</text><text x="983" y="268" class="sm f-muted">and the merge</text><text x="983" y="285" class="sm f-muted">trailers.</text>
<text x="32" y="32" class="title f-ink">How Waggle builds Waggle</text>
</svg>
