<svg xmlns="http://www.w3.org/2000/svg" class="wg" viewBox="0 0 1120 312" width="1120" height="312" role="img" aria-labelledby="wg-hive-t wg-hive-d">
<title id="wg-hive-t">How Waggle builds Waggle</title>
<desc id="wg-hive-d">How the Waggle repo builds Waggle. The Keeper, the human, answers decision cards from the queen, the only agent session the Keeper talks to. The queen sends a goal to a scout, which writes a task brief with its lease, gate and risk tier. A builder writes the code inside that lease. Two reviewers running on different models review it; each returns pass or must-fix with an Intent Packet, and both must pass. Waggle Gate checks every commit against the lease, protected paths need the Head Keeper, and the PR merges.</desc>
