<text x="86" y="87" class="b f-ink" text-anchor="middle">Keeper</text>
<text x="168" y="76" class="sm f-muted">The human. Answers cards</text><text x="168" y="92" class="sm f-muted">and approves protected</text><text x="168" y="108" class="sm f-muted">paths.</text>
<path d="M79 106L79 128" fill="none" class="s-ink" stroke-width="1.5"/><path d="M82.39 123.05L79 128L75.61 123.05" fill="none" class="s-ink" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M93 128L93 106" fill="none" class="s-ink" stroke-width="1.5"/><path d="M89.61 110.95L93 106L96.39 110.95" fill="none" class="s-ink" stroke-width="1.5" stroke-linejoin="miter"/>
