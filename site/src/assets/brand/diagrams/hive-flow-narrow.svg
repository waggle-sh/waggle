<text x="168" y="388" class="sm f-muted">Writes the code, inside the</text><text x="168" y="404" class="sm f-muted">lease only.</text>
<path d="M86 418L86 440" fill="none" class="s-ink" stroke-width="1.5"/><path d="M89.39 435.05L86 440L82.61 435.05" fill="none" class="s-ink" stroke-width="1.5" stroke-linejoin="miter"/>
<rect x="20" y="444" width="132" height="36" class="f-page s-ink" stroke-width="1.5"/>
<text x="30" y="467" class="sm b f-ink">guard A</text>
<rect x="20" y="488" width="132" height="36" class="f-page s-ink" stroke-width="1.5"/>
<text x="30" y="511" class="sm b f-ink">guard B</text>
<rect x="92" y="450" width="54" height="24" class="f-page s-pass" stroke-width="1.5"/><text x="119" y="466" text-anchor="middle" class="mono b f-pass">pass</text>
<rect x="92" y="494" width="54" height="24" class="f-page s-pass" stroke-width="1.5"/><text x="119" y="510" text-anchor="middle" class="mono b f-pass">pass</text>
<text x="168" y="460" class="sm f-muted">Two reviewers on different</text><text x="168" y="476" class="sm f-muted">models. Both must pass.</text><text x="168" y="492" class="sm f-muted">They never fix.</text>
