<text x="20" y="586" class="sm b f-ink">Waggle Gate</text>
<text x="168" y="568" class="sm f-muted">Checks every commit</text><text x="168" y="584" class="sm f-muted">against the lease.</text>
<path d="M86 594L86 616" fill="none" class="s-ink" stroke-width="1.5"/><path d="M89.39 611.05L86 616L82.61 611.05" fill="none" class="s-ink" stroke-width="1.5" stroke-linejoin="miter"/>
<rect x="20" y="620" width="132" height="44" class="f-page s-pass" stroke-width="1.5"/>
<text x="86" y="647" class="b f-pass" text-anchor="middle">merge</text>
<text x="168" y="636" class="sm f-muted">Recorded in DECISIONS.md</text><text x="168" y="652" class="sm f-muted">and the merge trailers.</text>
