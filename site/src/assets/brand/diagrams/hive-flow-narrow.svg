<text x="42" y="324" class="sm f-ink">the lease</text>
<text x="168" y="292" class="sm f-muted">Written before work starts:</text><text x="168" y="308" class="sm f-muted">the lease, the gate, the risk</text><text x="168" y="324" class="sm f-muted">tier.</text>
<path d="M86 346L86 368" fill="none" class="s-ink" stroke-width="1.5"/><path d="M89.39 363.05L86 368L82.61 363.05" fill="none" class="s-ink" stroke-width="1.5" stroke-linejoin="miter"/>
